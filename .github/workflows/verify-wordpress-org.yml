name: Verify WordPress.org deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Check plugin and dry-run SVN deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify version, PHP syntax, and packaged files
        run: |
          python3 .github/scripts/verify-plugin.py
          python3 .github/scripts/update-wordpress-assets.py --check-only

      # A unique, temporary SVN tag avoids skipping the dry run because 2.0.8
      # already exists. The action never commits this tag or any other changes.
      - name: Stage WordPress.org deployment without committing
        id: dry_run
        # Pinned revision includes credential-free dry runs (unlike 2.3.0).
        uses: 10up/action-wordpress-plugin-deploy@008657da18d18e065aaaccd287fa3af53ff768a1
        with:
          dry-run: true
          generate-zip: true
        env:
          SLUG: wpiko-chatbot
          ASSETS_DIR: wordpress-org-assets
          VERSION: verify-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save verified plugin ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wpiko-chatbot-verified-package
          path: ${{ steps.dry_run.outputs.zip-path }}
          if-no-files-found: error
          retention-days: 7
