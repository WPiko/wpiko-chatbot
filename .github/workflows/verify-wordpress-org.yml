name: Verify WordPress.org deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Check plugin and dry-run SVN deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out plugin
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify version, PHP syntax, and packaged files
        run: python3 .github/scripts/verify-plugin.py

      # A unique, temporary SVN tag avoids skipping the dry run because 2.0.8
      # already exists. The action never commits this tag or any other changes.
      - name: Stage WordPress.org deployment without committing
        id: dry_run
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        with:
          dry-run: true
          generate-zip: true
        env:
          SLUG: wpiko-chatbot
          VERSION: verify-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save verified plugin ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wpiko-chatbot-verified-package
          path: ${{ steps.dry_run.outputs.zip-path }}
          if-no-files-found: error
          retention-days: 7
