name: Publish to WordPress.org

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Test only (leave unchecked to publish the plugin version)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: wordpress-org-wpiko-chatbot
  cancel-in-progress: false

jobs:
  release:
    name: Validate and deploy release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check publishing secrets
        env:
          HAS_SVN_USERNAME: ${{ secrets.SVN_USERNAME != '' }}
          HAS_SVN_PASSWORD: ${{ secrets.SVN_PASSWORD != '' }}
        run: |
          if [ "$HAS_SVN_USERNAME" != true ] || [ "$HAS_SVN_PASSWORD" != true ]; then
            echo "::error::Add SVN_USERNAME and SVN_PASSWORD in repository Actions secrets."
            exit 1
          fi

      - name: Validate release and artwork
        id: release
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Select main when running this workflow."
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main
          options=(--output-version)
          if [ "$DRY_RUN" != true ]; then
            options+=(--require-new-release)
          fi
          python3 .github/scripts/verify-plugin.py "${options[@]}"
          python3 .github/scripts/update-wordpress-assets.py --check-only

      # A retry may reuse a tag for this exact commit, but never replace one.
      # GITHUB_TOKEN tag pushes do not trigger another workflow run.
      - name: Create the GitHub version tag
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_VERSION"; then
            if [ "$(git rev-parse "refs/tags/$RELEASE_VERSION^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::The version tag already points to another commit. Choose a new version."
              exit 1
            fi
          else
            git tag "$RELEASE_VERSION"
          fi
          git push origin "refs/tags/$RELEASE_VERSION"

      - name: Publish plugin code, SVN version tag, and artwork
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@008657da18d18e065aaaccd287fa3af53ff768a1
        with:
          dry-run: ${{ inputs.dry_run }}
          generate-zip: true
        env:
          SLUG: wpiko-chatbot
          ASSETS_DIR: wordpress-org-assets
          VERSION: ${{ !inputs.dry_run && steps.release.outputs.version || format('verify-release-{0}-{1}', github.run_id, github.run_attempt) }}
          SVN_USERNAME: ${{ !inputs.dry_run && secrets.SVN_USERNAME || '' }}
          SVN_PASSWORD: ${{ !inputs.dry_run && secrets.SVN_PASSWORD || '' }}

      - name: Save plugin package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wpiko-chatbot-package-${{ github.run_id }}
          path: ${{ steps.deploy.outputs.zip-path }}
          if-no-files-found: error
          retention-days: 7
