name: Release to WordPress.org

on:
  push:
    tags: ['[0-9]*']
  # Manual runs only verify publishing setup; they never publish plugin code.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wordpress-org-wpiko-chatbot
  cancel-in-progress: false

jobs:
  release:
    name: Validate and deploy release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check publishing secrets
        env:
          HAS_SVN_USERNAME: ${{ secrets.SVN_USERNAME != '' }}
          HAS_SVN_PASSWORD: ${{ secrets.SVN_PASSWORD != '' }}
        run: |
          if [ "$HAS_SVN_USERNAME" != true ] || [ "$HAS_SVN_PASSWORD" != true ]; then
            echo "::error::Add SVN_USERNAME and SVN_PASSWORD in repository Actions secrets."
            exit 1
          fi

      - name: Validate release and artwork
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            python3 .github/scripts/verify-plugin.py --expect-version "$RELEASE_VERSION" --require-new-release
          else
            python3 .github/scripts/verify-plugin.py
          fi
          python3 .github/scripts/update-wordpress-assets.py --check-only

      - name: Deploy tagged release or stage manual verification
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@008657da18d18e065aaaccd287fa3af53ff768a1
        with:
          dry-run: ${{ github.event_name != 'push' }}
          generate-zip: true
        env:
          SLUG: wpiko-chatbot
          VERSION: ${{ github.event_name == 'push' && github.ref_name || format('verify-release-{0}-{1}', github.run_id, github.run_attempt) }}
          SVN_USERNAME: ${{ github.event_name == 'push' && secrets.SVN_USERNAME || '' }}
          SVN_PASSWORD: ${{ github.event_name == 'push' && secrets.SVN_PASSWORD || '' }}

      - name: Save plugin package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wpiko-chatbot-package-${{ github.run_id }}
          path: ${{ steps.deploy.outputs.zip-path }}
          if-no-files-found: error
          retention-days: 7
