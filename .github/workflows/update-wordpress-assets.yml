name: Update WordPress.org artwork

on:
  push:
    branches: [main]
    paths:
      - wordpress-org-assets/**
  workflow_dispatch:
    inputs:
      publish:
        description: Publish artwork changes (leave unchecked for a dry run)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: wordpress-org-wpiko-chatbot
  cancel-in-progress: false

jobs:
  artwork:
    name: Synchronize directory artwork
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out artwork from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Validate artwork and publishing secrets
        env:
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          HAS_SVN_USERNAME: ${{ secrets.SVN_USERNAME != '' }}
          HAS_SVN_PASSWORD: ${{ secrets.SVN_PASSWORD != '' }}
        run: |
          python3 .github/scripts/update-wordpress-assets.py --check-only
          if [ "$PUBLISH" = true ] && { [ "$HAS_SVN_USERNAME" != true ] || [ "$HAS_SVN_PASSWORD" != true ]; }; then
            echo "::error::Add SVN_USERNAME and SVN_PASSWORD in repository Actions secrets."
            exit 1
          fi

      - name: Install SVN
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion

      - name: Stage or publish only directory artwork
        env:
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          SVN_USERNAME: ${{ (github.event_name == 'push' || inputs.publish) && secrets.SVN_USERNAME || '' }}
          SVN_PASSWORD: ${{ (github.event_name == 'push' || inputs.publish) && secrets.SVN_PASSWORD || '' }}
        run: |
          if [ "$PUBLISH" = true ]; then
            python3 .github/scripts/update-wordpress-assets.py --publish
          else
            python3 .github/scripts/update-wordpress-assets.py
          fi
